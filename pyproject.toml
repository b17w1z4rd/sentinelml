[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelml"
version = "0.1.0"
description = "Leakage-aware endpoint telemetry threat scoring research baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.scripts]
sentinelml = "sentinelml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
